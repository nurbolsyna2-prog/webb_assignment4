<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web page </title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <form>


        <div class="mb-3">
            <label for="name" class="form-label">Name:</label>
            <input type="text" id="name" name="name" maxlength="50" minlength="2" required class="form-control"
                placeholder="e.g Suizza Han">
            <div class="form-text">Write your name</div>

        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="email" required
                placeholder="need to write correct email">
            <div class="form-text">email@domain.com</div>
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea id="message" name="message" required maxlength="200" minlength="10" class="form-control"
                placeholder="Write your message here..."></textarea>
            <div class="form-text">Write your message, it can't be empty min 10 characters</div>

        </div>
        <input type="submit" value="submit">

    </form>

</body>


</html>
