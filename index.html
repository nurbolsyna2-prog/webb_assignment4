<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web page </title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="nav-links">
        <ul>
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="registration.html">Registration</a></li>
        </ul>
    </nav>

    <div class="container">


        <form>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">Name:</label>
                    <input type="text" id="name" name="name" maxlength="50" minlength="2" required
                        class="form-control is-invalid" placeholder="e.g Suizza">
                    <div class="invalid-feedback">Name is invalid.</div>
                    <div class="form-text">Write your name</div>

                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control is-valid" id="email" name="email" required
                        placeholder="need to write correct email">
                    <div class="valid-feedback">Email is valid.</div>
                    <div class="form-text">email@domain.com</div>



                    <div class="col-12">
                        <label for="message" class="form-label">Message</label>
                        <textarea id="message" name="message" required maxlength="200" minlength="10"
                            class="form-control" placeholder="Write your message here..."></textarea>
                        <div class="form-text">Write your message, it can't be empty min 10 characters</div>


                        <button type="submit" class="btn btn-secondary">Submit</button>

        </form>

</body>


</html>
